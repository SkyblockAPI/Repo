name: Transform

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Berlin"

jobs:
  parse-basic-items:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3
        with:
            token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '26'

      - name: Run Script
        run: |
          rm -rf ./neu
          git clone --depth 1 https://github.com/NotEnoughUpdates/NotEnoughUpdates-REPO.git ./neu
          node .github/scripts/parsers/parse.mjs

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config --global user.email "meowtomation@mona.cat"
          git config --global user.name "meowtomation"
          git add .
          git commit -m "Update Repository"
          git push
